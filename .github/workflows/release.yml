name: Release

# Pushes to main only test and build. Publishing needs a `v*` tag matching the
# version in pyproject.toml, and uses PyPI trusted publishing, so no token is
# stored anywhere. PyPI matches on this file name and the `pypi` environment.
# The GitHub release follows PyPI, with notes generated from the commit history.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git-cliff needs the commits and the previous tag.
          persist-credentials: false

      # No cache: whatever ends up on PyPI should only come from this run.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: false

      - run: uv sync --locked --all-extras
      - run: uv run pytest

      - name: Check that the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "v$(uv version --short)"

      - run: uv build

      # Here rather than next to the release, to fail before anything is published.
      - name: Generate the release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: uv run git-cliff --current --strip all --output release-notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/larkify/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: Create the GitHub release
    needs: publish
    runs-on: ubuntu-latest
    # The only job that can write to the repository, and it checks nothing out.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes

      - run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --notes-file release-notes.md
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
